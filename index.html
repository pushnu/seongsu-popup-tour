<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>성수 팝업 투어</title>
<meta name="theme-color" content="#1f6feb">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="성수 팝업">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/icon-192.png">
<style>
:root{--blue:#1f6feb;--star:#e8a200;--grey:#8a8f98;--bg:#fff;--fg:#111;--line:#e3e5e8;--muted:#5b6068;--safe-b:env(safe-area-inset-bottom)}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font:17px/1.4 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;overscroll-behavior:none}
body{display:flex;flex-direction:column}
button{font:inherit;cursor:pointer;border:0;border-radius:12px;background:#f0f2f5;color:var(--fg);min-height:48px;padding:0 16px}
button.primary{background:var(--blue);color:#fff}
button.on{background:var(--fg);color:#fff}
header{padding:8px 12px calc(8px);display:grid;gap:8px;border-bottom:1px solid var(--line)}
.row{display:flex;gap:8px}
#q{flex:1;min-width:0;font:inherit;border:1px solid var(--line);border-radius:12px;padding:0 14px;min-height:48px}
#chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
#chips button{flex:0 0 auto;min-height:40px;padding:0 14px;font-size:15px}
#offline{display:none;background:#fff3cd;color:#664d03;font-size:14px;padding:6px 12px;text-align:center}
main{flex:1;position:relative;min-height:0}
#map{position:absolute;inset:0}
#list{position:absolute;inset:0;overflow-y:auto;padding:8px 12px calc(16px + var(--safe-b));display:none}
#list.show{display:block}
.show-list #map{visibility:hidden}
.item{width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);border-radius:0;padding:12px 4px;display:grid;gap:3px;min-height:64px}
.item b{font-size:17px}
.item .m{font-size:14px;color:var(--muted)}
.tag{display:inline-block;font-size:13px;border-radius:8px;padding:1px 8px;margin-right:4px;background:#eef3ff;color:#1a4fb3}
.tag.star{background:#fff4d6;color:#8a5f00}.tag.done{background:#e9ecef;color:#495057}.tag.book{background:#fde8ea;color:#a4202f}.tag.last{background:#fde8ea;color:#a4202f}
.pin{width:30px;height:30px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);background:var(--blue);border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center}
.pin.star{background:var(--star)}.pin.done{background:var(--grey)}
.pin span{transform:rotate(45deg);color:#fff;font-size:13px;font-weight:700}
.me{width:18px;height:18px;border-radius:50%;background:#1f6feb;border:3px solid #fff;box-shadow:0 0 0 2px #1f6feb}
#sheet{position:fixed;left:0;right:0;bottom:0;background:var(--bg);border-radius:18px 18px 0 0;box-shadow:0 -4px 20px rgba(0,0,0,.2);padding:12px 16px calc(16px + var(--safe-b));max-height:75vh;overflow-y:auto;display:none;z-index:1000}
#sheet.show{display:block}
#sheet h2{font-size:20px;margin:6px 0 4px;padding-right:48px}
#sheet p{margin:6px 0;font-size:16px}
#sheet .note{background:#fff8e6;border-left:4px solid var(--star);padding:6px 10px;font-size:15px;margin:8px 0}
#sheet .book{background:#fde8ea;border-left:4px solid #a4202f;padding:6px 10px;font-size:15px;margin:8px 0}
#sheet .book a,#sheet .book-ok a{color:#a4202f;word-break:break-all}
#close{position:absolute;right:10px;top:10px;min-height:40px;width:40px;padding:0;border-radius:50%;font-size:20px}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.actions .wide{grid-column:1/-1}
.small{font-size:13px;color:var(--muted)}
.rowi{display:flex;gap:4px;align-items:center;border-bottom:1px solid var(--line)}.rowi .item{flex:1;border:0}.rowi .mv{width:44px;padding:0;min-height:44px;border-radius:8px}
.route{display:grid;gap:8px;padding:8px 0 12px;border-bottom:1px solid var(--line)}
.actions a.primary,.actions a.sec,.route a.primary{display:flex;align-items:center;justify-content:center;border-radius:12px;min-height:48px;text-decoration:none;text-align:center}
.actions a.primary,.route a.primary{color:#fff;background:var(--blue)}.actions a.sec{color:var(--fg);background:#f0f2f5}
#fab{position:absolute;right:12px;bottom:calc(16px + var(--safe-b));z-index:900;box-shadow:0 2px 8px rgba(0,0,0,.3);min-height:52px;font-weight:600}
</style>
</head>
<body>
<div id="install" style="display:none;background:#eef3ff;padding:8px 12px;text-align:center"><button class="primary" id="install-btn">홈 화면에 앱 설치</button><span class="small" id="ios" style="display:none">Safari 공유 버튼 → '홈 화면에 추가'를 누르면 앱처럼 쓸 수 있어요.</span></div>
<div id="offline">오프라인: 목록·상세·저장 상태만 볼 수 있어요. 지도 타일과 길찾기는 인터넷이 필요합니다.</div>
<header>
  <div class="row">
    <input id="q" type="search" placeholder="팝업 이름 검색" autocomplete="off">
    <button id="toggle" aria-label="지도/목록 전환">목록</button>
  </div>
  <div id="chips">
    <button data-f="all" class="on">전체</button>
    <button data-f="want">가고 싶은 곳</button>
  </div>
</header>
<main>
  <div id="map"></div>
  <div id="list"></div>
  <button id="fab" class="primary">내 위치</button>
</main>
<div id="sheet"><button id="close" aria-label="닫기">✕</button><div id="sheet-body"></div></div>
<script type="module" src="app.js"></script>
</body>
</html>
